<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The ART of loving MARGA</title>
<meta name="theme-color" content="#0a1431">
<link rel="icon" href="assets/file-1-a44c41.png">
<meta name="description" content="Artfol & Margarette — December 28, 2026">
<style>@font-face{font-family:'Cinzel';font-style:normal;font-weight:400 900;font-display:swap;src:url(assets/file-2-01c064.woff2) format('woff2')}
@font-face{font-family:'Cinzel Decorative';font-style:normal;font-weight:400;font-display:swap;src:url(assets/file-3-c62087.woff2) format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:300 700;font-display:swap;src:url(assets/file-4-5a0fdd.woff2) format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:300 700;font-display:swap;src:url(assets/file-5-01a8c6.woff2) format('woff2')}
@font-face{font-family:'Pinyon Script';font-style:normal;font-weight:400;font-display:swap;src:url(assets/file-6-917f65.woff2) format('woff2')}
:root{--frame:url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27100%27%20height=%27100%27%20viewBox=%270%200%20100%20100%27%3E%3Cpath%20d=%27M25.30%201.30H74.70A24%2024%200%200%200%2098.70%2025.30V74.70A24%2024%200%200%200%2074.70%2098.70H25.30A24%2024%200%200%200%201.30%2074.70V25.30A24%2024%200%200%200%2025.30%201.30Z%27%20fill=%27%23f8f1e6%27%20stroke=%27%235b1323%27%20stroke-width=%272.6%27/%3E%3Cpath%20d=%27M29.01%205.30H70.99A28.0%2028.0%200%200%200%2094.70%2029.01V70.99A28.0%2028.0%200%200%200%2070.99%2094.70H29.01A28.0%2028.0%200%200%200%205.30%2070.99V29.01A28.0%2028.0%200%200%200%2029.01%205.30Z%27%20fill=%27none%27%20stroke=%27%23b98a5e%27%20stroke-width=%27.7%27/%3E%3C/svg%3E")}
:root{
  --navy:#0a1431; --navy2:#13245a; --wine:#5b1323; --wine2:#7d2336; --cream:#f8f1e6; --ink:#3b1019; --muted:#7a625c;
  --gold:#b98a5e; --copper:#b98a5e; --gold2:#e3c295;
  --disp:'Cinzel Decorative','Cinzel',Georgia,serif; --cap:'Cinzel',Georgia,serif; --body:'Cormorant Garamond',Georgia,serif; --script:'Pinyon Script','Cormorant Garamond',cursive;
  --ease:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:#0a1431;color:var(--cream);font-family:var(--body);font-weight:500;font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden;height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(120% 80% at 10% -10%,rgba(60,92,180,.38),transparent 62%),
  radial-gradient(100% 70% at 100% 105%,rgba(44,70,150,.40),transparent 62%),
  linear-gradient(180deg,#0c193d,#0a1331 55%,#070e26)}
body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:
  linear-gradient(112deg,transparent 36%,rgba(92,124,214,.10) 44%,rgba(92,124,214,.03) 50%,transparent 58%),
  linear-gradient(112deg,transparent 62%,rgba(92,124,214,.07) 70%,transparent 78%);animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-3%,0,0)}to{transform:translate3d(3%,0,0)}}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
main,.sec{position:relative;z-index:1}

/* corner florals (cut from the plate photo) */
.amb{position:fixed;z-index:0;pointer-events:none;background-size:cover;background-position:center;opacity:0;transition:opacity 2.4s 1s ease}
body.opened .amb{opacity:.8}
body.opened.on-invite .amb{opacity:0}
.amb.tl{left:0;top:0;width:min(30vw,340px);aspect-ratio:215/240;-webkit-mask-image:radial-gradient(circle at 0 0,#000 30%,transparent 72%);mask-image:radial-gradient(circle at 0 0,#000 30%,transparent 72%)}
.amb.br{right:0;bottom:0;width:min(32vw,370px);aspect-ratio:234/262;-webkit-mask-image:radial-gradient(circle at 100% 100%,#000 30%,transparent 72%);mask-image:radial-gradient(circle at 100% 100%,#000 30%,transparent 72%)}
@media(max-width:700px){body.opened .amb{opacity:.6}}

/* ---------- COVER ---------- */
#cover{position:fixed;inset:0;z-index:800;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;
  background:radial-gradient(90% 70% at 50% 45%,#17295f 0,#0b1636 55%,#070e24 100%);
  transition:opacity 1.2s ease,transform 1.4s cubic-bezier(.7,0,.2,1),filter 1.2s}
#cover.go{opacity:0;transform:scale(1.16);filter:blur(8px);pointer-events:none}
.cover-in{width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3.4vh,34px)}
.site-title{font-family:var(--disp);font-weight:400;font-size:clamp(19px,3.6vw,34px);letter-spacing:.14em;color:#efe2d0;text-align:center;line-height:1.3;animation:fadeIn 1.6s .2s var(--ease) both}
.site-title b{font-weight:400;background:linear-gradient(180deg,#f6dcb8,#c38e66);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#e3c295}
.site-title::after{content:"";display:block;width:64px;height:1px;background:var(--gold);margin:16px auto 0;opacity:.8}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pwrap{position:relative;width:min(96vw,1060px,calc((100vh - 210px)*2));animation:plateIn 2.2s .5s var(--ease) both}
@keyframes plateIn{from{opacity:0;transform:scale(1.045)}to{opacity:1;transform:none}}
.pimg{display:block;width:100%;height:auto;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),linear-gradient(0deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),linear-gradient(0deg,transparent,#000 12%,#000 88%,transparent);mask-composite:intersect}
.hot{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;border-radius:50%;border:1px solid rgba(240,214,170,.85);background:transparent;cursor:pointer;padding:0;
  animation:breathe 3.2s 2.4s ease-in-out infinite;transition:transform .6s var(--ease),border-color .4s}
.hot:hover{transform:translate(-50%,-50%) scale(1.06);border-color:#fff}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(240,214,170,.55)}60%{box-shadow:0 0 0 clamp(10px,2.2vw,22px) rgba(240,214,170,0)}}
.cover-hint{font-family:var(--cap);font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#d8c4a8;text-align:center;animation:fadeIn 1.6s 2s var(--ease) both}

/* ---------- NAV ---------- */
#prog{position:fixed;top:0;left:0;right:0;height:2px;z-index:320;background:linear-gradient(90deg,var(--gold),#f0d3a8);transform:scaleX(0);transform-origin:0 50%}
#nav{position:fixed;top:0;left:0;right:0;z-index:300;display:flex;justify-content:flex-start;gap:clamp(0px,1.6vw,22px);padding:14px 12px 26px;
  background:linear-gradient(#0a1431f0 35%,#0a143100);transform:translateY(-110%);opacity:0;transition:transform 1s .5s var(--ease),opacity 1s .5s;overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav a:first-child{margin-left:auto}#nav a:last-child{margin-right:auto}
body.opened #nav{transform:none;opacity:1}
#nav a{position:relative;font-family:var(--cap);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;text-decoration:none;color:rgba(241,226,205,.72);padding:6px 9px;white-space:nowrap;transition:color .4s}
#nav a::after{content:"";position:absolute;left:9px;right:9px;bottom:0;height:1px;background:var(--gold2);transform:scaleX(0);transition:transform .5s var(--ease)}
#nav a:hover,#nav a.on{color:#fff}
#nav a:hover::after,#nav a.on::after{transform:scaleX(1)}

/* ---------- SECTIONS & FRAME ---------- */
main{opacity:0;transition:opacity 1.2s .5s}
body.opened main{opacity:1}
.sec{padding:clamp(80px,11vh,118px) 16px 18px;display:flex;justify-content:center}
.wrap{position:relative;width:min(100%,760px)}
.card{--bw:40px;position:relative;border:var(--bw) solid transparent;border-image:var(--frame) 40 fill/var(--bw)/0 stretch;
  padding:clamp(20px,5vw,46px) clamp(6px,4vw,42px) clamp(26px,5vw,52px);text-align:center;color:var(--ink);
  filter:drop-shadow(0 28px 34px rgba(0,0,0,.5)) drop-shadow(0 3px 4px rgba(0,0,0,.35))}
@media(max-width:640px){.card{--bw:26px}}
.card.rv{transform:translateY(34px) scale(.985)}
.card.rv.in{transform:none}
.card>*{opacity:0;transform:translateY(12px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.card.in>*{opacity:1;transform:none}
.card.in>*:nth-child(1){transition-delay:.3s}.card.in>*:nth-child(2){transition-delay:.4s}.card.in>*:nth-child(3){transition-delay:.5s}
.card.in>*:nth-child(4){transition-delay:.6s}.card.in>*:nth-child(5){transition-delay:.7s}.card.in>*:nth-child(6){transition-delay:.8s}
.card.in>*:nth-child(n+7){transition-delay:.9s}

.title{font-family:var(--disp);font-weight:400;color:var(--wine);font-size:clamp(30px,6.2vw,50px);letter-spacing:.05em;line-height:1.1}
.sub{font-family:var(--script);font-size:clamp(26px,4.6vw,34px);color:var(--wine2);margin-top:8px;line-height:1.1}
.orn{display:block;width:min(100%,230px);height:14px;margin:26px auto;color:var(--gold);overflow:visible}
.cap{font-family:var(--cap);font-weight:400;text-transform:uppercase;letter-spacing:.16em;font-size:clamp(12.5px,2.6vw,15.5px);line-height:1.8}
.cap.sm{font-size:clamp(12px,2.4vw,14.5px);letter-spacing:.14em}
.nm{font-family:var(--disp);font-weight:400;color:var(--wine);font-size:clamp(22px,5.4vw,42px);line-height:1.2;letter-spacing:.02em}
.and{font-family:var(--cap);letter-spacing:.3em;margin:8px 0;font-size:16px;font-weight:400}
.info3{display:flex;justify-content:center;align-items:stretch;margin:6px 0}
.info3>div{flex:1;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.info3>div+div{border-left:1px solid rgba(185,138,94,.7)}
.info3 svg{width:40px;height:40px;color:var(--wine)}
.info3 .cap{font-size:clamp(11px,2.2vw,14px)}
.recep{display:flex;justify-content:center;align-items:center;gap:16px;text-align:left}
.recep svg{width:36px;height:40px;color:var(--wine);flex:none}
.recep b{font-family:var(--cap);font-weight:500;letter-spacing:.14em;font-size:14px;display:block}
.recep span{font-family:var(--cap);letter-spacing:.1em;font-size:14px}
.quote{font-family:var(--cap);font-weight:400;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(12.5px,2.5vw,15px)}
.quote small{display:block;font-size:11.5px;margin-top:6px;letter-spacing:.14em;color:var(--muted)}
.cornertxt{position:absolute;font-family:var(--cap);text-transform:uppercase;letter-spacing:.3em;font-size:10px;color:#b9bfd6;line-height:2}
.cornertxt.tr{right:-150px;top:0;text-align:center}.cornertxt.bl{left:-150px;bottom:0}
@media(max-width:1180px){.cornertxt{display:none}}

/* invitation picture + live countdown */
.inv-img{position:relative;width:min(100%,700px);margin:0 auto;container-type:inline-size}
.inv-img>img{width:100%;display:block;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 6%,#000 94%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 3%,#000 97%,transparent 100%);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent 0,#000 6%,#000 94%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 3%,#000 97%,transparent 100%);mask-composite:intersect}
.cdov{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--wine);overflow:hidden}
.cdov .cl{font-family:var(--script);font-size:4.5cqw;line-height:1.05;color:var(--wine2)}
.cdov .ch{font-family:var(--disp);font-weight:400;font-size:11cqw;line-height:1.05;letter-spacing:.03em}
.cdov .chs{font-family:var(--cap);font-size:1.5cqw;letter-spacing:.55em;text-transform:uppercase;color:var(--muted);margin-top:.4cqw}
.cdov .cr{font-family:var(--cap);font-size:2cqw;margin-top:1.4cqw;display:flex;gap:2.6cqw;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.cdov .cr b{font-weight:500;color:var(--wine);font-size:2.7cqw;margin-right:.3cqw}
.cdov .cd-done{font-family:var(--script);font-size:8cqw;color:var(--wine)}
.cdbox{margin:30px 6px 6px;padding:26px 14px}
.cd-label{font-family:var(--script);font-size:clamp(25px,5vw,34px);color:var(--wine2);line-height:1.1}
.cd-hours{font-family:var(--disp);font-size:clamp(44px,12vw,86px);color:var(--wine);line-height:1.1}
.cd-hours-s{font-family:var(--cap);letter-spacing:.5em;text-transform:uppercase;font-size:11px;color:var(--muted)}
.cd-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px auto 0;max-width:460px}
.cd-tiles div{border-top:1px solid var(--gold);padding-top:8px}
.cd-tiles b{display:block;font-family:var(--cap);font-weight:500;font-size:clamp(20px,5vw,28px);color:var(--wine)}
.cd-tiles span{font-family:var(--cap);font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}
.cd-done{font-family:var(--script);font-size:44px;color:var(--wine)}

/* buttons */
.btn{display:inline-block;background:var(--wine);color:#f6e8dc;border:1px solid var(--wine);border-radius:0;padding:13px 30px;font-family:var(--cap);font-weight:500;letter-spacing:.26em;text-transform:uppercase;font-size:11px;cursor:pointer;text-decoration:none;transition:background .4s,color .4s,letter-spacing .5s var(--ease),transform .4s}
.btn:hover{background:transparent;color:var(--wine);letter-spacing:.32em}
.btn.dis{background:transparent;border-color:rgba(122,98,92,.5);color:var(--muted);cursor:default;pointer-events:none;letter-spacing:.2em}
.btn.ghost{background:transparent;color:var(--wine)}
.btn.ghost:hover{background:var(--wine);color:#f6e8dc}
.btn:disabled{opacity:.6;cursor:wait}

/* venue */
.venues{display:grid;grid-template-columns:1fr 1fr;gap:34px 30px;margin-top:8px;text-align:center}
@media(max-width:700px){.venues{grid-template-columns:1fr}}
.vcard{display:flex;flex-direction:column;align-items:center;gap:10px}
.vimg{width:calc(100% - 12px);aspect-ratio:4/3;object-fit:cover;background:linear-gradient(135deg,#f1e6d4,#e3d1b6);border:0;outline:1px solid var(--gold);outline-offset:6px;display:flex;align-items:center;justify-content:center;color:#bfa586;overflow:hidden;margin:6px 0 8px}
.vimg svg{width:54px;height:54px}
.vt{font-family:var(--cap);font-weight:400;letter-spacing:.3em;text-transform:uppercase;font-size:11.5px;color:var(--muted)}
.vn{font-family:var(--disp);font-size:clamp(20px,3.6vw,25px);color:var(--wine);line-height:1.2}
.va{font-size:19px;margin-bottom:6px}
.vmap{width:min(100%,250px);border:1px solid var(--gold);padding:4px;background:#fff;display:block}

/* entourage */
.ent{display:grid;grid-template-columns:1fr 1fr;gap:40px 26px;margin-top:6px}
.ent .g.full{grid-column:1/-1}
@media(max-width:560px){.ent{grid-template-columns:1fr}}
.ent h3{font-family:var(--cap);font-weight:500;color:var(--wine);font-size:clamp(12.5px,2.4vw,14px);letter-spacing:.3em;text-transform:uppercase;margin-bottom:16px}
.ent h3::after{content:"";display:block;width:30px;height:1px;background:var(--gold);margin:11px auto 0}
.ent p{font-size:clamp(19px,3.2vw,21.5px);line-height:1.65}
.ent .g.full .nl{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;max-width:560px;margin:0 auto}
@media(max-width:480px){.ent .g.full .nl{grid-template-columns:1fr}}

/* dress code */
.dimgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:26px;margin:30px 0}
.dimg{display:flex;flex-direction:column;gap:10px;align-items:center}
.dimg .vimg{aspect-ratio:3/4;margin:6px 6px 4px}
.dimg span{font-family:var(--cap);letter-spacing:.26em;text-transform:uppercase;font-size:11px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;justify-content:center;gap:26px 22px;margin:30px 0 8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:14px;width:92px}
.sw i{width:58px;height:58px;border-radius:50%;display:block;box-shadow:0 0 0 4px var(--cream),0 0 0 5px var(--gold),0 10px 16px -6px rgba(0,0,0,.4),inset 0 -8px 14px rgba(0,0,0,.18),inset 0 6px 10px rgba(255,255,255,.18);transition:transform .6s var(--ease)}
.sw:hover i{transform:translateY(-4px)}
.sw span{font-family:var(--cap);letter-spacing:.18em;text-transform:uppercase;font-size:10.5px;line-height:1.5;color:var(--ink)}
.dnote{font-family:var(--script);font-size:30px;color:var(--wine2);margin-top:12px}
.gift{margin:34px auto 0;padding:30px 34px;background:var(--wine);color:#f1dfd0;font-size:clamp(19px,3.2vw,21px);font-style:italic;line-height:1.7;outline:1px solid rgba(227,194,149,.6);outline-offset:-8px}

/* RSVP */
.rform{max-width:460px;margin:30px auto 0;text-align:left;display:flex;flex-direction:column;gap:22px}
.rform label.f{display:flex;flex-direction:column;gap:2px}
.rform label.f span,.lbl{font-family:var(--cap);font-weight:400;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.rform input[type=text],.rform input[type=email]{border:0;border-bottom:1px solid var(--gold);background:transparent;font-family:var(--body);font-weight:500;font-size:22px;padding:8px 2px;color:var(--ink);outline:none;border-radius:0;transition:border-color .4s,box-shadow .4s}
.rform input::placeholder{color:#b3a39b;font-style:italic}
.rform input:focus{border-color:var(--wine);box-shadow:0 1px 0 var(--wine)}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.pills label{cursor:pointer;position:relative}
.pills input{position:absolute;opacity:0}
.pills span{display:block;text-align:center;border:1px solid var(--gold);padding:14px 8px;font-family:var(--cap);font-weight:400;font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:background .4s,color .4s,border-color .4s;color:var(--ink)}
.pills label:hover span{border-color:var(--wine)}
.pills input:checked+span{background:var(--wine);border-color:var(--wine);color:#f6e8dc}
.pills input:focus-visible+span{outline:2px solid var(--gold2);outline-offset:3px}
.rform .btn{margin-top:4px;padding:16px;width:100%}
.err{color:#9c1c2a;font-size:17px;min-height:22px}
.deadline{margin-top:24px;font-style:italic;color:var(--muted);font-size:19px}

/* FAQ */
.faq{margin-top:8px;display:flex;flex-direction:column;text-align:left}
.faq>div{padding:24px 6px;border-top:1px solid rgba(185,138,94,.6)}
.faq>div:last-child{border-bottom:1px solid rgba(185,138,94,.6)}
.faq h4{font-family:var(--cap);font-weight:500;letter-spacing:.14em;font-size:14px;text-transform:uppercase;color:var(--wine);margin-bottom:8px;line-height:1.5}
.faq p{font-size:20px}
.faq a.lk{display:inline-block;margin-top:12px;font-family:var(--cap);font-weight:400;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--wine2);border-bottom:1px solid var(--gold);text-decoration:none;padding-bottom:3px;cursor:pointer;transition:letter-spacing .5s var(--ease),color .3s}
.faq a.lk:hover{color:var(--wine);letter-spacing:.34em}

/* closing */
.sweet{font-size:clamp(21px,3.6vw,25px);font-style:italic;line-height:1.75;margin:4px auto;max-width:560px}
.sign{font-family:var(--script);font-size:clamp(44px,8vw,58px);color:var(--wine);line-height:1.2}
.sealimg{width:92px;display:block;margin:0 auto 10px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.35))}
footer{text-align:center;padding:44px 16px 120px;font-family:var(--cap);font-size:10.5px;letter-spacing:.4em;text-transform:uppercase;color:#8d99c0}

/* reveal fallback */
.rv{opacity:0;transform:translateY(30px);transition:opacity 1.2s var(--ease),transform 1.2s var(--ease)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv,.card>*,.card.rv{opacity:1!important;transform:none!important}
  html{scroll-behavior:auto}
}

/* admin monogram */

      Promise.all(jobs).then(()=>setStatus('Saved online ✓')).catch(()=>setStatus('Offline – not synced',1));
    } else setStatus('Saved on this device');
    renderSite();
  };
  now ? go() : (saveT=setTimeout(go,450));
}

  $$('.rv:not(.in)').forEach(e=>io.observe(e));
}

/* ---------- guests / seating ---------- */
function members(g){
  return [{name:g.name,primary:true}].concat(splitN(g.companions).map(n=>({name:n}))).filter(m=>m.name&&m.name.trim()).map(m=>({name:m.name.trim(),primary:!!m.primary,key:keyOf(m.name),pid:g.id}));
}
const allMembers = () => DB.guests.flatMap(g=>members(g).map(m=>Object.assign({g},m)));
function findMember(name){
  const n=norm(name), all=allMembers();
  const ex=all.filter(m=>norm(m.name)===n);
  if(ex.length) return ex.length===1?ex[0]:'amb';
  const t=n.split(' ').filter(Boolean); if(t.length<2) return 'short';
  const fz=all.filter(m=>{const mt=norm(m.name).split(' ');return t.every(x=>mt.includes(x))});
  return fz.length===1?fz[0]:(fz.length>1?'amb':null);
}
function seatMap(){
  const c={},out={};
  DB.guests.forEach(g=>members(g).forEach(m=>{ if(g.table){ c[g.table]=(c[g.table]||0)+1; out[m.key]={table:g.table,seat:c[g.table]}; } }));
  return out;
}
const seatTxt = (SM,m) => SM[m.key] ? `${esc(SM[m.key].table)} · Seat ${SM[m.key].seat}` : 'Table to be assigned';
const dateStr = t => new Date(t).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric',timeZone:'Asia/Manila'});

async function record(m,g,att,email,by){
  const o={name:m.name,email,attending:att,by,at:Date.now(),pid:g.id};
  DB.rsvps[m.key]=o; saveRsvpLocal();
  if(cloud.on){ try{ await cloud.put('rsvps/'+m.key,o) }catch(e){} }
}
function ticket(g,title,lead){
  const SM=seatMap();
  const rows=members(g).filter(m=>DB.rsvps[m.key]&&DB.rsvps[m.key].attending==='yes');
  return `<div class="mt">${title}</div>${lead?`<p>${lead}</p>`:''}
   <div class="seats">${rows.map(m=>`<div class="seat"><b>${esc(m.name)}</b><span>${seatTxt(SM,m)}</span></div>`).join('')}</div>
   <button class="btn" data-act="mclose">Close</button>`;
}
function partyStep(g,me,title,lead){
  const pending=members(g).filter(m=>m.key!==me.key&&!DB.rsvps[m.key]);
  if(!pending.length){ modal(ticket(g,title,lead)); return; }
  const SM=seatMap();
  modal(`<div class="mt">${title}</div>${lead?`<p>${lead}</p>`:''}
    <div class="seats"><div class="seat"><b>${esc(me.name)}</b><span>${seatTxt(SM,me)}</span></div></div>
    <p style="margin-top:14px">Your invitation also includes the guest(s) below. Select who will be attending so their seats are reserved.</p>
    <div class="chk">${pending.map(m=>`<label><input type="checkbox" value="${esc(m.key)}" checked> ${esc(m.name)} <span style="margin-left:auto;font-family:var(--cap);font-size:12px;color:var(--wine)">${seatTxt(SM,m)}</span></label>`).join('')}</div>
    <button class="btn" data-act="party-yes" data-pid="${esc(g.id)}" data-me="${esc(me.key)}">Confirm seats</button>
    <button class="btn ghost" data-act="party-skip" data-pid="${esc(g.id)}" data-me="${esc(me.key)}">Just me</button>`);
}
$('#modal').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act!=='party-yes'&&b.dataset.act!=='party-skip') return;
  const g=DB.guests.find(x=>x.id===b.dataset.pid); if(!g) return;
  const me=members(g).find(m=>m.key===b.dataset.me); if(!me) return;
  if(b.dataset.act==='party-yes'){
    const keys=$$('.chk input:checked',$('#modal')).map(i=>i.value);
    const email=(DB.rsvps[me.key]||{}).email||'';
    for(const m of members(g)){ if(keys.includes(m.key)&&!DB.rsvps[m.key]) await record(m,g,'yes',email,me.name); }
    modal(ticket(g,'Seats reserved'));
  } else modal(ticket(g,'You’re confirmed'));
});

async function submitRSVP(e){
  e.preventDefault();
  const f=e.target, err=$('#rErr'), name=f.name.value.trim(), email=f.email.value.trim(), att=(f.att.value||'');
  err.textContent='';
  if(name.length<3){ err.textContent='Please enter your full name.'; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Please enter a valid email address.'; return; }
  if(!att){ err.textContent='Please tell us if you will be attending.'; return; }
  const btn=$('button[type=submit]',f); btn.disabled=true; btn.textContent='Checking…';
  try{
    await pullCloud(false);
    const hit=findMember(name);
    if(hit==='short'){ modal(`<div class="mt">One moment</div><p>Please enter your complete name (first and last name) exactly as it appears on your invitation.</p><button class="btn" data-act="mclose">Okay</button>`); return; }
    if(hit==='amb'){ modal(`<div class="mt">One moment</div><p>We found more than one similar name. Kindly enter your complete name exactly as it appears on your invitation.</p><button class="btn" data-act="mclose">Okay</button>`); return; }
    if(!hit){
      const a={name,email,at:Date.now()}; DB.attempts.push(a); saveRsvpLocal();
      if(cloud.on){ try{ await cloud.post('attempts',a) }catch(x){} }
      modal(`<div class="mt">With Regret</div><p>Thank you for your interest in celebrating with us. We are sorry to share that we could not find your name on our guest list.</p><p>As seating at our wedding is limited and by personal invitation only, we are unable to accommodate additional guests.</p><p>We kindly ask for your understanding.</p><button class="btn" data-act="mclose">Close</button>`);
      return;
    }
    const g=hit.g, me=members(g).find(m=>m.key===hit.key), ex=DB.rsvps[me.key];
    if(ex){
      const by=ex.by&&norm(ex.by)!==norm(me.name)?ex.by:null, when=dateStr(ex.at);
      if(ex.attending==='yes'){
        partyStep(g,me,'Already RSVP’d', by?`<b>${esc(by)}</b> has already RSVP’d on your behalf on ${when}. Your seat is reserved — no further action is needed.`:`We already received your RSVP on ${when}.`);
      } else {
        modal(`<div class="mt">Response on file</div><p>${by?`<b>${esc(by)}</b> responded for you on ${when}.`:`We already received your response on ${when}.`} It was recorded as <b>unable to attend</b>.</p><button class="btn" data-act="mclose">Close</button>`);
      }
      return;
    }
    await record(me,g,att,email,me.name);
    f.reset();
    if(att==='no'){ modal(`<div class="mt">We’ll Miss You</div><p>Thank you for letting us know, ${esc(me.name.split(' ')[0])}. Your response has been recorded.</p><button class="btn" data-act="mclose">Close</button>`); }
    else partyStep(g,me,'You’re Confirmed','Thank you! Your reserved seat is below.');
  } finally { btn.disabled=false; btn.textContent='Submit RSVP'; }
}

const getPath = p => p.split('.').slice(1).reduce((o,k)=>o?.[k], p[0]==='g'?DB.guests:DB.settings);
function setPath(p,v){
  const parts=p.split('.'); let o=parts[0]==='g'?DB.guests:DB.settings;
  for(let i=1;i<parts.length-1;i++) o=o[parts[i]];

function refreshComputed(){
  const SM=seatMap();
  DB.guests.forEach((g,i)=>{

    set('no',g.table?ms.map(m=>SM[m.key]?.seat).join(', '):'—');
    const yes=ms.filter(m=>DB.rsvps[m.key]?.attending==='yes').length, no=ms.filter(m=>DB.rsvps[m.key]?.attending==='no').length;
    set('st',`<span class="pill ${yes?'y':(no===ms.length&&no?'n':'p')}">${yes}/${ms.length} attending</span>`);
  });
  const cap=Number(S().capacity)||10, ov=$('#ov'); if(!ov) return;
  const cnt={},conf={}; DB.guests.forEach(g=>{ if(!g.table) return; members(g).forEach(m=>{cnt[g.table]=(cnt[g.table]||0)+1; if(DB.rsvps[m.key]?.attending==='yes')conf[g.table]=(conf[g.table]||0)+1;}); });
  const un=DB.guests.filter(g=>!g.table).reduce((a,g)=>a+members(g).length,0);
  ov.innerHTML=TBL().map(t=>`<div class="${(cnt[t]||0)>cap?'over':''}"><b>${t}</b>${cnt[t]||0} / ${cap} seats · ${conf[t]||0} confirmed</div>`).join('')+(un?`<div><b>Unassigned</b>${un} seat(s)</div>`:'');
}

function readImg(file,max=1100){
  return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); }; im.src=r.result; }; r.readAsDataURL(file); });
}

   case 'up': if(i>0){ [L[i-1],L[i]]=[L[i],L[i-1]]; persist('s',true); rerender(); } break;
   case 'down': if(i<L.length-1){ [L[i+1],L[i]]=[L[i],L[i+1]]; persist('s',true); rerender(); } break;
   case 'clear-img': setPath(b.dataset.p,''); persist('s',true); rerender(); break;
   case 'reset-rsvp': { const k=b.dataset.k; delete DB.rsvps[k]; saveRsvpLocal(); if(cloud.on){ try{await cloud.del('rsvps/'+k)}catch(x){} } rerender(); break; }
   case 'reset-rsvps': if(confirm('Clear ALL RSVPs? This cannot be undone.')){ DB.rsvps={}; DB.attempts=[]; saveRsvpLocal(); if(cloud.on){ try{await cloud.del('rsvps'); await cloud.del('attempts')}catch(x){} } rerender(); } break;
   case 'reset-all': if(confirm('Reset all content and the guest list to the defaults?')){ const n=normDB(null,true); DB.settings=n.settings; DB.guests=n.guests; persist('all',true); renderAdmin(); } break;
   case 'push-all': if(!cloud.on){ alert('Online sync is not set up yet. Add your Firebase URL to CLOUD_URL first.'); } else { persist('all',true); alert('Sent. Open the site on another device to confirm it loads your edits.'); } break;
   case 'export-json': download('wedding-backup.json',JSON.stringify({settings:DB.settings,guests:DB.guests},null,1),'application/json'); break;
   case 'copy-embed': { const txt=JSON.stringify({settings:DB.settings,guests:DB.guests}); try{ await navigator.clipboard.writeText(txt); b.textContent='Copied ✓'; }catch(x){ prompt('Copy this text:',txt); } break; }
   case 'export-csv': {
     const q=v=>`"${String(v??'').replace(/"/g,'""')}"`, lines=[['Table','Seat','Guest','Response','Email','Responded by','Date'].map(q).join(',')];
     rsvpRows().forEach(x=>lines.push([x.s?.table||'',x.s?.seat||'',x.m.name,x.r?(x.r.attending==='yes'?'Attending':'Declined'):'Pending',x.r?.email||'',x.r?(norm(x.r.by)===norm(x.m.name)?'Self':x.r.by):'',x.r?dateStr(x.r.at):''].map(q).join(',')));
     download('rsvp-list.csv',lines.join('\n'),'text/csv'); break; }
  }
});

/* scroll progress + active nav link */
const NAVSEC=['invite','venue','entourage','dress','rsvp','faq'];
let spy=false;
function onScroll(){ if(spy) return; spy=true; requestAnimationFrame(()=>{ spy=false;
  const d=document.documentElement, mx=d.scrollHeight-innerHeight; $('#prog').style.transform=`scaleX(${mx>0?Math.min(1,scrollY/mx):0})`;
  let cur=''; NAVSEC.forEach(id=>{ const el=document.getElementById(id); if(el&&el.getBoundingClientRect().top<innerHeight*.45) cur=id; });
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.go===cur)); document.body.classList.toggle('on-invite',cur==='invite'||cur===''); }); }
addEventListener('scroll',onScroll,{passive:true}); setTimeout(onScroll,1300); addEventListener('resize',onScroll);

/* ---------- boot ---------- */
$('.amb.tl').style.backgroundImage=`url("${ASSET.flTL}")`;
$('.amb.br').style.backgroundImage=`url("${ASSET.flBR}")`;
$('#monoBtn').style.backgroundImage=`url("${ASSET.seal}")`;
loadInitial();
renderSite();
let opened=false; try{ opened=sessionStorage.getItem('marga_open')==='1'; }catch(e){}
if(opened){ $('#cover').style.display='none'; document.body.classList.remove('lock'); document.body.classList.add('opened'); }
observe();
pullCloud(true).then(()=>{ if(cloud.on) renderSite(); });
</script>
